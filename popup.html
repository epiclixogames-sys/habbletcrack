<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bb-ui-bg: #14110b;
            --bb-ui-surface: #1d170e;
            --bb-ui-text: #fff;
            --bb-ui-muted: rgba(255, 237, 213, .68);
            --bb-ui-accent: #f59e0b;
            --bb-ui-primary: #f59e0b;
            --bb-ui-on-primary: #241600;
            --bb-ui-border: rgba(245, 158, 11, .28);
            --bb-ui-tint: rgba(255, 255, 255, .04);
            --bb-ui-line: rgba(255, 255, 255, .09);
            --bb-ui-ok-bg: #052e16;
            --bb-ui-ok-text: #bbf7d0;
            --bb-ui-err-text: #fecaca;
        }
        [hidden] {
            display: none !important;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 280px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bb-ui-bg);
            color: var(--bb-ui-text);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 14px 16px;
            background: var(--bb-ui-surface);
            border-bottom: 1px solid var(--bb-ui-border);
            box-shadow: inset 0 2px 0 var(--bb-ui-accent);
        }
        .header h1 {
            font-size: 16px;
            font-weight: 700;
        }
        .header .version {
            padding: 2px 8px;
            border: 1px solid var(--bb-ui-border);
            border-radius: 999px;
            background: var(--bb-ui-tint);
            color: var(--bb-ui-muted);
            font-size: 11px;
            font-weight: 600;
        }
        .content {
            padding: 14px 16px 16px;
        }
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--bb-ui-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }
        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            background: var(--bb-ui-tint);
            border: 1px solid var(--bb-ui-line);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: border-color .15s;
        }
        .toggle-item:hover {
            border-color: var(--bb-ui-border);
        }
        .toggle-info {
            flex: 1;
            min-width: 0;
        }
        .toggle-label {
            font-size: 13px;
            font-weight: 600;
        }
        .toggle-desc {
            font-size: 11px;
            color: var(--bb-ui-muted);
            margin-top: 3px;
        }
        .toggle-switch {
            position: relative;
            flex-shrink: 0;
            width: 42px;
            height: 24px;
            border: 0;
            border-radius: 999px;
            background: var(--bb-ui-border);
            cursor: pointer;
            transition: background .15s;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--bb-ui-text);
            transition: transform .15s, background .15s;
        }
        .toggle-switch.active {
            background: var(--bb-ui-primary);
        }
        .toggle-switch.active::after {
            background: var(--bb-ui-on-primary);
            transform: translateX(18px);
        }
        .toggle-switch:focus-visible {
            outline: 2px solid var(--bb-ui-accent);
            outline-offset: 2px;
        }
        .footer {
            padding: 12px 16px;
            border-top: 1px solid var(--bb-ui-line);
            text-align: center;
        }
        .footer a {
            color: var(--bb-ui-accent);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .status {
            border-radius: 8px;
            background: var(--bb-ui-ok-bg);
            color: var(--bb-ui-ok-text);
            font-size: 11px;
            font-weight: 600;
            text-align: center;
        }
        .status.visible {
            margin-top: 12px;
            padding: 8px 12px;
        }
        .mkt-title {
            margin-top: 18px;
        }
        .mkt-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid var(--bb-ui-border);
            border-radius: 10px;
            background: var(--bb-ui-surface);
        }
        .mkt-who {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mkt-icon {
            display: grid;
            place-items: center;
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: color-mix(in srgb, var(--bb-ui-accent) 14%, transparent);
            color: var(--bb-ui-accent);
        }
        .mkt-who-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .mkt-nick {
            font-size: 13px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        .mkt-state,
        .mkt-msg {
            color: var(--bb-ui-muted);
            font-size: 11px;
            line-height: 1.4;
        }
        .mkt-msg[data-tone="err"] {
            color: var(--bb-ui-err-text);
        }
        .mkt-msg:empty {
            display: none;
        }
        .mkt-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 10px 16px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: var(--bb-ui-primary);
            color: var(--bb-ui-on-primary);
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .mkt-button[data-kind="secondary"] {
            padding: 9px 16px;
            border-color: var(--bb-ui-border);
            background: transparent;
            color: var(--bb-ui-text);
            font-size: 12px;
        }
        .mkt-button[data-kind="secondary"]:hover:not(:disabled) {
            background: var(--bb-ui-tint);
        }
        .mkt-button:disabled {
            opacity: .55;
            cursor: default;
        }
        .mkt-button:focus-visible {
            outline: 2px solid var(--bb-ui-accent);
            outline-offset: 2px;
        }
        @media (prefers-reduced-motion: reduce) {
            .toggle-item,
            .toggle-switch,
            .toggle-switch::after {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Bananablet</h1>
        <div class="version">v5.9.4</div>
    </div>

    <div class="content">
        <div class="section-title">Configurações</div>

        <div class="toggle-item">
            <div class="toggle-info">
                <div class="toggle-label" id="label-ads">Bloquear Anúncios</div>
                <div class="toggle-desc">Remove anúncios automaticamente</div>
            </div>
            <button type="button" class="toggle-switch" id="toggle-ads" role="switch" aria-checked="false" aria-labelledby="label-ads"></button>
        </div>

        <div class="toggle-item">
            <div class="toggle-info">
                <div class="toggle-label" id="label-radio">Remover Rádio</div>
                <div class="toggle-desc">Remove o player de rádio</div>
            </div>
            <button type="button" class="toggle-switch" id="toggle-radio" role="switch" aria-checked="false" aria-labelledby="label-radio"></button>
        </div>

        <div class="status" id="status" role="status"></div>

        <section id="mkt-section" aria-labelledby="mkt-title" hidden>
            <h2 class="section-title mkt-title" id="mkt-title">Marketplace</h2>
            <div class="mkt-card">
                <div class="mkt-who">
                    <span class="mkt-icon">
                        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9"/><path d="M3 10l2-6h14l2 6"/><path d="M3 10a3 3 0 0 0 6 0a3 3 0 0 0 6 0a3 3 0 0 0 6 0"/><path d="M10 20v-5h4v5"/></svg>
                    </span>
                    <div class="mkt-who-text">
                        <span class="mkt-nick" id="mkt-nick" hidden></span>
                        <span class="mkt-state" id="mkt-state"></span>
                    </div>
                </div>
                <button type="button" class="mkt-button" id="mkt-open" hidden>Abrir marketplace</button>
                <button type="button" class="mkt-button" data-kind="secondary" id="mkt-logout" hidden>
                    <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
                    Sair deste computador
                </button>
                <p class="mkt-msg" id="mkt-msg" role="status"></p>
            </div>
        </section>
    </div>

    <div class="footer">
        <a href="https://bananablet.dev/suporte" target="_blank">Suporte</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
