<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apoiar o Bananablet</title>
    <style>
        :root {
            --mola: linear(0,.033,.113,.217,.33,.441,.545,.637,.717,.784,.839,.884,.918,.945,.965,.979,.99,.997,1.001,1.004,1.006,1.006,1.006,1.006,1.005,1.005,1.004,1.003,1);
            --mola-festa: linear(0,.031,.108,.213,.331,.451,.566,.671,.762,.839,.901,.95,.987,1.013,1.03,1.04,1.045,1.046,1.044,1.04,1.035,1.029,1.024,1.018,1.014,1.01,1.006,1.004,1);
            --suave: cubic-bezier(.32,.72,0,1);
            --fundo: linear-gradient(160deg, #14110b, #0f0b07);
            --fundo-liso: #14110b;
            --card: linear-gradient(145deg, #1d170e, rgba(42,32,16,.55));
            --campo: #1d170e;
            --borda: rgba(245,158,11,.18);
            --borda-forte: rgba(245,158,11,.34);
            --linha: rgba(255,255,255,.09);
            --txt: #fff;
            --sec: rgba(255,237,213,.68);
            --ter: rgba(253,230,138,.42);
            --acento: #f59e0b;
            --acento-2: #f97316;
            --ouro: #fbbf24;
            --creme: #fde68a;
            --acento-fundo: rgba(245,158,11,.16);
            --trilho: rgba(255,255,255,.09);
            --verde: #22c55e;
            --vermelho: #fca5a5;
            color-scheme: dark;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { background: var(--fundo-liso); color: var(--txt); font-family: Ubuntu, 'Segoe UI', Arial, sans-serif; font-size: 13.5px; line-height: 1.4; -webkit-font-smoothing: antialiased; overflow: hidden; }
        button, input { font: inherit; color: inherit; }
        [hidden] { display: none !important; }
        .ja-sheet { position: fixed; inset: 0; background: var(--fundo); display: flex; flex-direction: column; overflow: hidden; }
        .ja-nav { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--linha); }
        .ja-nav-titulo { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ja-icone { width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: transparent; color: var(--txt); cursor: pointer; transition: border-color .15s ease, background-color .15s ease, transform .3s var(--mola); }
        .ja-icone:hover { border-color: var(--borda-forte); background: rgba(245,158,11,.08); }
        .ja-icone:active { transform: scale(.92); }
        .ja-icone:focus-visible, .ja-bt:focus-visible, .ja-seg button:focus-visible, .ja-switch:focus-visible, .ja-erro button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
        .ja-tela { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
        .ja-conteudo { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(245,158,11,.3) transparent; padding: 18px 16px; display: flex; flex-direction: column; gap: 18px; }
        .ja-card { border: 1px solid var(--borda); border-radius: 13px; background: var(--card); }
        .ja-hero { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
        .ja-hero > span:first-child { display: flex; flex-shrink: 0; }
        .ja-hero-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .ja-hero-centro { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
        .ja-grande { font-size: 36px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .ja-medio { font-size: 32px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
        .ja-nota { color: var(--sec); font-size: 13px; }
        .ja-bloco { display: flex; flex-direction: column; gap: 10px; }
        .ja-secao { font-size: 14px; font-weight: 700; }
        .ja-rodape { color: var(--sec); font-size: 12.5px; line-height: 1.45; }
        .ja-seg { display: grid; gap: 8px; }
        .ja-seg button { height: 42px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--borda); border-radius: 10px; background: var(--campo); color: var(--txt); font-size: 14px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; transition: border-color .15s ease, background-color .15s ease, color .15s ease, transform .3s var(--mola); }
        .ja-seg button:hover { border-color: var(--borda-forte); }
        .ja-seg button:active { transform: scale(.96); }
        .ja-seg button[aria-pressed="true"] { border-color: var(--acento); background: rgba(245,158,11,.18); color: var(--ouro); }
        .ja-campo { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border: 1px solid var(--borda); border-radius: 10px; background: var(--campo); cursor: text; transition: border-color .15s ease; }
        .ja-campo:focus-within { border-color: var(--acento); }
        .ja-campo > span { color: var(--sec); flex-shrink: 0; }
        .ja-campo input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--txt); font-size: 14px; font-weight: 700; }
        .ja-input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--borda); border-radius: 10px; outline: 0; background: var(--campo); color: var(--txt); font-size: 14px; transition: border-color .15s ease; }
        .ja-input:focus { border-color: var(--acento); }
        .ja-campo input::placeholder, .ja-input::placeholder { color: var(--ter); font-weight: 400; }
        .ja-campo-col { display: flex; flex-direction: column; gap: 6px; }
        .ja-campo-col > span { font-size: 14px; font-weight: 700; }
        .ja-lista { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.04); }
        .ja-avatar { --ja-rosto: .32; position: relative; overflow: hidden; width: 28px; height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: rgba(245,158,11,.18); color: var(--ouro); font-size: 13px; font-weight: 700; }
        .ja-rosto { position: absolute; top: calc(50% - 106px * var(--ja-rosto)); left: calc(50% - 86px * var(--ja-rosto)); display: block; width: calc(180px * var(--ja-rosto)); max-width: none; height: calc(260px * var(--ja-rosto)); pointer-events: none; }
        .ja-nick { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ja-nick[data-anon="1"] { color: var(--sec); }
        .ja-lista-valor { color: var(--ouro); font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .ja-linha-switch { display: flex; align-items: center; gap: 12px; min-height: 42px; }
        .ja-linha-switch > span { flex: 1; font-size: 14px; }
        .ja-switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; border: 0; border-radius: 999px; padding: 0; cursor: pointer; background: rgba(255,255,255,.14); transition: background-color .2s ease; }
        .ja-switch span { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 999px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .5s var(--mola); }
        .ja-switch[aria-checked="true"] { background: linear-gradient(135deg, var(--acento), var(--acento-2)); }
        .ja-switch[aria-checked="true"] span { transform: translateX(18px); }
        .ja-base { flex-shrink: 0; padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 10px; }
        .ja-erro { padding: 9px 12px; border: 1px solid rgba(239,68,68,.3); border-radius: 10px; background: rgba(239,68,68,.1); color: var(--vermelho); font-size: 13px; line-height: 1.4; }
        .ja-erro button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }
        .ja-bt { width: 100%; height: 42px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .3s var(--mola), filter .15s ease, opacity .2s ease, background-color .15s ease; }
        .ja-bt:active { transform: scale(.97); }
        .ja-bt:disabled { opacity: .5; cursor: default; transform: none; filter: none; }
        .ja-bt-pri { background: linear-gradient(135deg, var(--acento), var(--acento-2)); color: #1a1206; box-shadow: 0 6px 18px rgba(245,158,11,.22); }
        .ja-bt-pri:hover:not(:disabled) { filter: brightness(1.07); }
        .ja-bt-curto { width: auto; flex-shrink: 0; padding: 0 16px; }
        .ja-bt-contorno { border: 1px solid rgba(245,158,11,.4); background: transparent; color: var(--ouro); }
        .ja-bt-contorno:hover { background: rgba(245,158,11,.08); }
        #ja-concluir { flex-shrink: 0; width: auto; margin: 0 16px 18px; }
        .ja-qr { align-self: center; padding: 10px; border-radius: 13px; background: #fff; box-shadow: 0 0 0 1px var(--borda), 0 10px 30px rgba(0,0,0,.35); }
        .ja-qr svg { display: block; width: 196px; height: 196px; }
        .ja-qr path { fill: #14110b; }
        .ja-copia { display: flex; gap: 8px; }
        .ja-codigo { flex: 1; min-width: 0; height: 42px; display: flex; flex-direction: column; justify-content: center; padding: 0 12px; border: 1px solid var(--borda); border-radius: 10px; background: var(--campo); }
        .ja-codigo span:first-child { color: var(--ter); font-size: 11px; line-height: 1.2; }
        .ja-codigo span:last-child { color: rgba(255,237,213,.85); font-size: 13px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: all; }
        .ja-esperando { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 13px; background: rgba(245,158,11,.1); border: 1px solid var(--borda); color: var(--creme); }
        .ja-esperando > span:first-child { display: flex; flex-shrink: 0; }
        .ja-espera { flex: 1; font-size: 13.5px; line-height: 1.4; }
        .ja-girando { flex-shrink: 0; display: flex; }
        .ja-info { display: flex; gap: 10px; padding: 12px; color: rgba(255,237,213,.82); font-size: 13px; line-height: 1.45; }
        .ja-info > span:first-child { display: flex; flex-shrink: 0; margin-top: 1px; }
        .ja-palco { position: relative; width: 160px; height: 132px; align-self: center; display: flex; align-items: flex-end; justify-content: center; flex-shrink: 0; }
        .ja-coracoes { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
        .ja-entra { position: relative; display: inline-flex; opacity: 0; transform: scale(.35); transform-origin: 50% 100%; transition: opacity .25s ease, transform .7s var(--mola-festa); }
        .ja-entra[data-on="1"] { opacity: 1; transform: none; }
        .ja-check-svg { position: absolute; right: -6px; bottom: 6px; overflow: visible; }
        .ja-check-circ { transform-origin: 20px 20px; transform: scale(0); transition: transform .62s var(--mola-festa) .15s; }
        .ja-check { stroke-dasharray: 40; stroke-dashoffset: 40; transition: stroke-dashoffset .5s var(--suave) .35s; }
        .ja-entra[data-check="1"] .ja-check-circ { transform: scale(1); }
        .ja-entra[data-check="1"] .ja-check { stroke-dashoffset: 0; }
        .ja-check-circ circle { fill: var(--verde); stroke: var(--fundo-liso); }
        .ja-ob-textos { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
        .ja-titulo-grande { font-size: 22px; font-weight: 700; line-height: 1.25; text-align: center; overflow-wrap: anywhere; }
        .ja-titulo-grande span + span { color: transparent; }
        .ja-texto-ob { max-width: 320px; color: var(--sec); font-size: 14px; line-height: 1.5; transition: opacity .4s ease; opacity: 0; }
        .ja-texto-ob[data-on="1"] { opacity: 1; }
        .ja-meta { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .ja-meta-linha { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 14px; }
        .ja-meta-linha b { font-weight: 700; font-variant-numeric: tabular-nums; }
        .ja-meta-linha .ja-sec { color: var(--sec); font-variant-numeric: tabular-nums; }
        .ja-meta-linha > .ja-sec:last-child { color: var(--ouro); font-weight: 700; }
        .ja-barra { position: relative; width: 100%; height: 6px; display: block; }
        .ja-trilho { position: absolute; inset: 0; border-radius: 999px; background: var(--trilho); overflow: hidden; display: block; }
        .ja-cheio { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--acento), var(--acento-2)); width: 0; }
        .ja-barra[data-batida="1"] .ja-cheio { background: var(--verde); }
        .ja-tick { position: absolute; top: 50%; width: 0; height: 0; display: block; }
        .ja-tick i { position: absolute; left: -1px; top: -6px; width: 2px; height: 12px; border-radius: 2px; background: rgba(255,237,213,.35); display: block; }
        .ja-tick svg { position: absolute; left: -6.5px; top: -6.5px; display: none; }
        .ja-tick[data-feito="1"] i { display: none; }
        .ja-tick[data-feito="1"] svg { display: block; }
        .ja-burst { position: absolute; top: 50%; width: 0; height: 0; pointer-events: none; }
        .ja-burst span { position: absolute; left: 0; top: 0; width: 0; height: 0; animation: ja-burst .9s var(--suave) both; }
        .ja-burst svg { position: absolute; left: -6px; top: -6px; overflow: visible; }
        @keyframes ja-burst { 0% { transform: translate(0, 0); opacity: 1; } 60% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
        .ja-marco { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 12px; background: var(--acento-fundo); color: var(--creme); font-size: 12.5px; font-weight: 700; line-height: 1.35; transition: opacity .3s ease, transform .7s var(--mola-festa); opacity: 0; transform: translateY(4px) scale(.9); }
        .ja-marco > span:first-child { display: flex; flex-shrink: 0; }
        .ja-marco[data-on="1"] { opacity: 1; transform: none; }
        .ja-ob { justify-content: center; gap: 14px; }
        .ja-centro { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 18px 28px; }
        .ja-centro > span:first-child { display: flex; }
        .ja-centro p { margin: 0; max-width: 320px; color: var(--sec); font-size: 14px; line-height: 1.5; }
        .ja-centro .ja-titulo-grande { font-size: 20px; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
            .ja-coracoes, .ja-burst { display: none !important; }
        }
    </style>
</head>
<body>
    <main class="ja-sheet" id="ja-sheet" aria-live="polite">
        <header class="ja-nav">
            <button type="button" class="ja-icone" id="ja-voltar" aria-label="Voltar" hidden>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
            </button>
            <div class="ja-nav-titulo" id="ja-nav-titulo">Apoiar o Bananablet</div>
            <button type="button" class="ja-icone" id="ja-fechar" aria-label="Fechar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
        </header>
        <div class="ja-tela" id="ja-tela"></div>
        <button type="button" class="ja-bt ja-bt-contorno" id="ja-concluir" hidden>Fechar</button>
    </main>
    <script src="qrcode.min.js"></script>
    <script src="doacoes-ui.js"></script>
    <script src="doar-window.js"></script>
</body>
</html>
