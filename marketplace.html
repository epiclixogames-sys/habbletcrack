<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace do Bananablet</title>
    <link rel="stylesheet" href="marketplace-notices.css">
    <style>
        :root {
            --bb-ui-bg: #14110b;
            --bb-ui-surface: #1d170e;
            --bb-ui-text: #fff;
            --bb-ui-muted: rgba(255, 237, 213, .68);
            --bb-ui-accent: #f59e0b;
            --bb-ui-primary: #f59e0b;
            --bb-ui-on-primary: #241600;
            --bb-ui-border: rgba(245, 158, 11, .28);
            --bb-ui-tint: rgba(255, 255, 255, .04);
            --bb-ui-line: rgba(255, 255, 255, .09);
            --bb-ui-ok-bg: #052e16;
            --bb-ui-ok-text: #bbf7d0;
            --bb-ui-err-bg: #450a0a;
            --bb-ui-err-text: #fecaca;
            --bb-ui-warn-bg: #451a03;
            --bb-ui-warn-text: #fde68a;
            --bb-ui-info-bg: #082f49;
            --bb-ui-info-text: #bae6fd;
            --mkt-accent-soft: color-mix(in srgb, var(--bb-ui-accent) 14%, transparent);
            --mkt-accent-step: color-mix(in srgb, var(--bb-ui-accent) 10%, transparent);
            --mkt-accent-faint: color-mix(in srgb, var(--bb-ui-accent) 6%, transparent);
            --mkt-accent-dash: color-mix(in srgb, var(--bb-ui-accent) 55%, transparent);
            --mkt-accent-half: color-mix(in srgb, var(--bb-ui-accent) 50%, transparent);
            --mkt-accent-line: color-mix(in srgb, var(--bb-ui-accent) 42%, transparent);
            --mkt-accent-pick: color-mix(in srgb, var(--bb-ui-accent) 70%, transparent);
            --mkt-ok-line: color-mix(in srgb, var(--bb-ui-ok-text) 35%, transparent);
            --mkt-warn-soft: color-mix(in srgb, var(--bb-ui-warn-text) 14%, transparent);
            --mkt-warn-line: color-mix(in srgb, var(--bb-ui-warn-text) 40%, transparent);
            --mkt-warn-faint: color-mix(in srgb, var(--bb-ui-warn-text) 6%, transparent);
            --mkt-avatar: color-mix(in srgb, var(--bb-ui-text) 6%, transparent);
            --mkt-step-num: color-mix(in srgb, var(--bb-ui-text) 8%, transparent);
            --mkt-field-line: rgba(255, 255, 255, .12);
            --mkt-soft-line: rgba(255, 255, 255, .06);
            --mkt-strong-line: rgba(255, 255, 255, .16);
            --mkt-bar-line: rgba(255, 255, 255, .05);
            --mkt-dot-line: rgba(255, 255, 255, .2);
            --mkt-tag-line: rgba(255, 255, 255, .25);
            --mkt-faint: rgba(255, 255, 255, .02);
            --mkt-muted-soft: rgba(255, 255, 255, .1);
            --mkt-text-soft: rgba(255, 237, 213, .82);
            --mkt-text-dim: rgba(255, 237, 213, .5);
            --mkt-tag-text: rgba(255, 237, 213, .85);
            --mkt-green: #86efac;
            --mkt-gold: #fbbf24;
            --mkt-selo-bg: #2b2106;
            --mkt-selo-ring: rgba(250, 204, 21, .6);
            --mkt-selo-text: #fde68a;
            --mkt-selo-solid: #facc15;
            --mkt-selo-on-solid: #2a1a00;
            --mkt-selo-shadow: rgba(0, 0, 0, .45);
            --mkt-selo-line: rgba(250, 204, 21, .45);
            --mkt-selo-soft: rgba(250, 204, 21, .16);
            --mkt-star-off: rgba(255, 237, 213, .35);
            --mkt-media: #0f0c08;
            --mkt-overlay: rgba(20, 17, 11, .82);
            --mkt-overlay-strong: rgba(20, 17, 11, .88);
            --mkt-zoom-bg: rgba(8, 6, 4, .95);
            --mkt-zoom-button: color-mix(in srgb, var(--bb-ui-surface) 90%, transparent);
            --mkt-ok-soft: rgba(34, 197, 94, .16);
            --mkt-info-soft: rgba(59, 130, 246, .18);
            --mkt-info-text: #bfdbfe;
            --mkt-info-faint: rgba(59, 130, 246, .1);
            --mkt-info-line: rgba(191, 219, 254, .35);
            --mkt-sunk: rgba(0, 0, 0, .2);
            --mkt-alert: #ef4444;
            --mkt-err-line: color-mix(in srgb, var(--mkt-alert) 55%, transparent);
            --mkt-err-soft: color-mix(in srgb, var(--mkt-alert) 20%, transparent);
            --mkt-err-faint: color-mix(in srgb, var(--mkt-alert) 8%, transparent);
            --mkt-ok-faint: color-mix(in srgb, var(--mkt-green) 7%, transparent);
            --mkt-enc-open-dot: #4ade80;
            --mkt-enc-open-text: #bbf7d0;
            --mkt-enc-open-line: rgba(74, 222, 128, .4);
            --mkt-enc-open-bg: rgba(74, 222, 128, .1);
            --mkt-enc-closed-dot: #a8a29e;
            --mkt-enc-closed-text: rgba(255, 237, 213, .85);
            --mkt-enc-closed-line: rgba(255, 255, 255, .2);
            --mkt-enc-closed-bg: rgba(255, 255, 255, .05);
            --mkt-enc-back-dot: #60a5fa;
            --mkt-enc-back-text: #bfdbfe;
            --mkt-enc-back-line: rgba(96, 165, 250, .4);
            --mkt-enc-back-bg: rgba(96, 165, 250, .1);
            --mkt-enc-tag-line: rgba(255, 255, 255, .14);
            --mkt-enc-style-bg: rgba(245, 158, 11, .12);
            --mkt-enc-style-text: #fcd34d;
            --mkt-promo-was: rgba(255, 237, 213, .55);
            --mkt-promo-chip-line: rgba(255, 255, 255, .14);
            --mkt-promo-chip-text: rgba(255, 237, 213, .8);
            --mkt-promo-chip-on: color-mix(in srgb, var(--bb-ui-accent) 60%, transparent);
            --mkt-mono: 'Cascadia Mono', Consolas, ui-monospace, monospace;
            color-scheme: dark;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
            background: transparent;
        }
        body {
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--bb-ui-text);
        }
        [hidden] {
            display: none !important;
        }
        .mkt {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            border: 1px solid var(--bb-ui-border);
            border-radius: 14px;
            background: var(--bb-ui-bg);
        }
        .mkt-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px 10px 16px;
            background: var(--bb-ui-surface);
            box-shadow: inset 0 2px 0 var(--bb-ui-accent);
        }
        .mkt-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            min-width: 0;
        }
        .mkt-draggable {
            cursor: grab;
        }
        .mkt-account {
            position: relative;
        }
        .mkt-draggable .mkt-brand {
            touch-action: none;
            user-select: none;
        }
        .mkt-dragging,
        .mkt-dragging * {
            cursor: grabbing !important;
        }
        .mkt-brand-name {
            font-size: 16px;
            font-weight: 700;
        }
        .mkt-search {
            flex: 1;
            min-width: 0;
            display: flex;
            margin: 0;
        }
        .mkt-search-field {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            padding: 0 12px;
            border: 1px solid var(--mkt-field-line);
            border-right: 0;
            border-radius: 9px 0 0 9px;
            background: var(--bb-ui-tint);
            color: var(--bb-ui-muted);
            cursor: text;
        }
        .mkt-search-field:focus-within {
            border-color: var(--bb-ui-accent);
        }
        .mkt-search-field svg {
            flex-shrink: 0;
        }
        .mkt-search-input {
            flex: 1;
            min-width: 0;
            height: 100%;
            padding: 0;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--bb-ui-text);
            font: inherit;
            font-size: 13px;
        }
        .mkt-search-input::placeholder {
            color: var(--bb-ui-muted);
        }
        .mkt-search-input::-webkit-search-cancel-button {
            appearance: none;
        }
        .mkt-search-go {
            flex-shrink: 0;
            height: 40px;
            padding: 0 16px;
            border: 0;
            border-radius: 0 9px 9px 0;
            background: var(--bb-ui-primary);
            color: var(--bb-ui-on-primary);
            font: inherit;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }
        .mkt-search-go:hover {
            filter: brightness(1.1);
        }
        .mkt-account {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            max-width: 190px;
            height: 40px;
            padding: 0 14px 0 6px;
            border: 1px solid var(--mkt-field-line);
            border-radius: 9px;
            background: transparent;
            color: var(--bb-ui-text);
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .mkt-account:hover {
            background: var(--bb-ui-line);
        }
        .mkt-account[aria-current="page"] {
            border-color: var(--mkt-accent-half);
            background: var(--mkt-accent-soft);
        }
        .mkt-account-nick {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .mkt-pixel {
            display: block;
            flex-shrink: 0;
            image-rendering: pixelated;
        }
        .mkt-close,
        .mkt-size {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            padding: 0;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--bb-ui-muted);
            cursor: pointer;
        }
        .mkt-close:hover,
        .mkt-size:hover {
            background: var(--bb-ui-line);
            color: var(--bb-ui-text);
        }
        .mkt-size + .mkt-close {
            margin-left: -8px;
        }
        .mkt-grip {
            position: absolute;
            right: 2px;
            bottom: 2px;
            z-index: 3;
            display: grid;
            place-items: center;
            width: 22px;
            height: 22px;
            color: var(--mkt-gold);
            cursor: nwse-resize;
            touch-action: none;
            user-select: none;
        }
        .mkt-resizing,
        .mkt-resizing * {
            cursor: nwse-resize !important;
            user-select: none;
        }
        .mkt-bar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 12px;
            min-height: 54px;
            padding: 4px 12px 4px 16px;
            border-top: 1px solid var(--mkt-bar-line);
            border-bottom: 1px solid var(--bb-ui-border);
            background: var(--bb-ui-surface);
        }
        .mkt-sections {
            display: flex;
            gap: 4px;
        }
        .mkt-section {
            padding: 7px 14px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--bb-ui-muted);
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .mkt-section:hover {
            background: var(--bb-ui-line);
            color: var(--bb-ui-text);
        }
        .mkt-section[aria-pressed="true"] {
            background: var(--mkt-accent-soft);
            color: var(--bb-ui-text);
        }
        .mkt-mine {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-left: auto;
        }
        .mkt-mine-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 46px;
            padding: 0 12px 0 4px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: var(--mkt-text-soft);
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .mkt-mine-item:hover {
            background: var(--bb-ui-line);
            color: var(--bb-ui-text);
        }
        .mkt-mine-item[aria-current="page"] {
            background: var(--mkt-accent-soft);
            color: var(--bb-ui-text);
        }
        .mkt-mine-icon {
            position: relative;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            width: 40px;
            height: 38px;
        }
        .mkt-close:focus-visible,
        .mkt-search-go:focus-visible,
        .mkt-account:focus-visible,
        .mkt-section:focus-visible,
        .mkt-mine-item:focus-visible,
        .mkt-seg-item:focus-visible,
        .mkt-chips-item:focus-visible,
        .mkt-selo-chip:focus-visible,
        .mkt-promo-chip:focus-visible,
        .mkt-select-field:has(.mkt-select:focus-visible),
        .mkt-card:focus-visible,
        .mkt-builder:focus-visible,
        .mkt-link:focus-visible,
        .mkt-chat-row:focus-visible,
        .mkt-svc-tile:focus-visible,
        .mkt-bubble-order:focus-visible,
        .mkt-gallery-nav:focus-visible,
        .mkt-join-pick:focus-visible,
        .mkt-join-close:focus-visible,
        .mkt-bestilo-botao:focus-visible,
        .mkt-bestilo-limpar:focus-visible,
        .mkt-enc-estilos-botao:focus-visible,
        .mkt-enc-estilos-tirar:focus-visible,
        .mkt-enc-estilos-aba:focus-visible {
            outline: 2px solid var(--bb-ui-accent);
            outline-offset: 2px;
        }
        .mkt-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px 18px 20px;
            margin-bottom: var(--mkt-dock, 0px);
            overflow: auto;
            scrollbar-color: var(--bb-ui-border) transparent;
        }
        .mkt-body[data-page="conta"] {
            gap: 16px;
            padding: 20px 22px;
        }
        .mkt-body > * {
            flex-shrink: 0;
        }
        .mkt-body > [data-foot] {
            margin-top: auto;
        }
        .mkt-body:focus,
        .mkt [tabindex="-1"]:focus {
            outline: none;
        }
        .mkt .bb-ui-badge {
            height: 20px;
            padding: 0 8px;
            font-size: 11px;
        }
        .mkt .bb-ui-button[data-size="sm"] {
            padding: 7px 12px;
            border-radius: 8px;
        }
        .mkt-icon-box {
            display: grid;
            place-items: center;
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--mkt-accent-soft);
            color: var(--bb-ui-accent);
        }
        .mkt-icon-box[data-size="sm"] {
            width: 30px;
            height: 30px;
        }
        .mkt-icon-box[data-size="md"] {
            width: 36px;
            height: 36px;
            border-radius: 9px;
        }
        .mkt-icon-box[data-size="lg"] {
            width: 44px;
            height: 44px;
            border-radius: 12px;
        }
        .mkt-icon-box[data-size="xl"] {
            width: 52px;
            height: 52px;
            border-radius: 14px;
        }
        .mkt-icon-box[data-tone="ok"] {
            border-radius: 50%;
            background: var(--bb-ui-ok-bg);
            color: var(--bb-ui-ok-text);
        }
        .mkt-icon-box:has(> .mkt-pixel) {
            background: transparent;
        }
        .mkt-icon-box[data-size="md"]:has(> .mkt-pixel) {
            width: 40px;
            height: 38px;
        }
        .mkt-h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }
        .mkt-h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 800;
            overflow-wrap: anywhere;
        }
        .mkt-lead {
            margin: 0;
            max-width: 560px;
            color: var(--bb-ui-muted);
            font-size: 13px;
            line-height: 1.5;
        }
        .mkt-lead strong {
            color: var(--bb-ui-text);
        }
        .mkt-intro {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .mkt-hello {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .mkt-hello .mkt-intro {
            gap: 4px;
        }
        .mkt-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 24px 24px 22px;
            border: 1px solid var(--bb-ui-border);
            border-radius: 12px;
            background: var(--bb-ui-surface);
            text-align: center;
        }
        .mkt-hero .mkt-lead {
            max-width: 460px;
        }
        .mkt-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border: 1px solid var(--bb-ui-line);
            border-radius: 10px;
            background: var(--bb-ui-tint);
        }
        .mkt-row[data-tone="accent"] {
            border-color: var(--bb-ui-border);
            background: var(--mkt-accent-faint);
        }
        .mkt-row[data-tone="current"] {
            border-color: var(--bb-ui-accent);
            background: var(--mkt-accent-faint);
        }
        .mkt-row[data-pad="lg"] {
            padding: 14px 16px;
        }
        .mkt-join {
            container: mkt-join / inline-size;
            display: flex;
            flex-direction: column;
            gap: 9px;
            padding: 12px 12px 10px 14px;
            border: 1px solid var(--mkt-accent-line);
            border-radius: 10px;
            background: linear-gradient(180deg, var(--mkt-accent-step), var(--mkt-accent-faint));
        }
        .mkt-body > :has(+ .mkt-join[data-foot]) {
            margin-bottom: 6px;
        }
        .mkt-join[data-tone="ok"] {
            flex-direction: row;
            align-items: center;
            gap: 10px;
            border-color: var(--mkt-ok-line);
            background: linear-gradient(180deg, var(--mkt-ok-soft), var(--mkt-ok-faint));
        }
        .mkt-join-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }
        .mkt-join-picks {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }
        .mkt-join-pick {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 32px;
            padding: 0 12px 0 8px;
            border: 1px solid var(--mkt-strong-line);
            border-radius: 999px;
            background: transparent;
            color: var(--mkt-tag-text);
            font: inherit;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }
        .mkt-join-pick:hover {
            border-color: var(--mkt-accent-half);
        }
        .mkt-join-pick[aria-pressed="true"] {
            border-color: var(--mkt-accent-pick);
            background: var(--mkt-accent-soft);
            color: var(--bb-ui-text);
            font-weight: 700;
        }
        .mkt-join-box {
            display: grid;
            place-items: center;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            border: 1.5px solid var(--mkt-text-dim);
            border-radius: 4px;
            color: var(--bb-ui-on-primary);
        }
        .mkt-join-pick[aria-pressed="true"] .mkt-join-box {
            border-color: var(--bb-ui-accent);
            background: var(--bb-ui-accent);
        }
        .mkt-join-text {
            margin: 0;
            color: var(--mkt-text-soft);
            font-size: 12px;
            line-height: 1.45;
        }
        .mkt-join-icon {
            display: grid;
            place-items: center;
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: var(--mkt-accent-soft);
            color: var(--mkt-gold);
        }
        .mkt-join[data-tone="ok"] .mkt-join-icon {
            background: var(--mkt-ok-soft);
            color: var(--mkt-green);
        }
        .mkt-join-title {
            margin: 0;
            color: var(--bb-ui-text);
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
        }
        .mkt-join[data-tone="ok"] .mkt-join-title {
            font-size: 13.5px;
        }
        .mkt-join-line {
            min-width: 0;
            display: flex;
            align-items: stretch;
            gap: 6px;
        }
        .mkt-join-line > .bb-ui-button {
            min-height: 34px;
            padding: 0 16px;
            white-space: nowrap;
        }
        .mkt-join-field {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 5px;
            height: 34px;
            padding: 0 10px;
            border: 1px solid var(--mkt-dot-line);
            border-radius: 8px;
            background: var(--mkt-sunk);
            color: var(--bb-ui-muted);
        }
        .mkt-join-field:focus-within {
            border-color: var(--bb-ui-accent);
        }
        .mkt-join-field[data-invalid] {
            border-color: var(--bb-ui-err-text);
            box-shadow: 0 0 0 3px var(--mkt-err-soft);
        }
        .mkt-join-input {
            flex: 1;
            min-width: 0;
            height: 100%;
            padding: 0;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--bb-ui-text);
            font: inherit;
            font-size: 13px;
        }
        .mkt-join-input::placeholder {
            color: var(--bb-ui-muted);
        }
        .mkt-join-foot,
        .mkt-join-error {
            display: flex;
            align-items: center;
            gap: 4px 6px;
            margin: 0;
            line-height: 1.4;
        }
        .mkt-join-foot {
            flex-wrap: wrap;
            color: var(--bb-ui-muted);
            font-size: 11px;
        }
        .mkt-join-error {
            align-items: flex-start;
            color: var(--bb-ui-err-text);

            margin: 0;
        }
        .mkt-svc-title {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .mkt-svc-tiles {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }
        .mkt-svc-tile {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px;
            border: 1px solid var(--bb-ui-line);
            border-radius: 12px;
            background: var(--bb-ui-tint);
            color: var(--bb-ui-text);
            font: inherit;
            text-align: left;
            cursor: pointer;
        }
        .mkt-svc-card[data-tone="accent"] .mkt-svc-tile {
            min-height: 88px;
        }
        .mkt-svc-tile:hover {
            border-color: var(--bb-ui-border);
        }
        .mkt-svc-tile[data-hot] {
            border-color: var(--mkt-accent-half);
            background: var(--mkt-accent-step);
        }
        .mkt-svc-num {
            font-size: 22px;
            line-height: 1;
        }
        .mkt-svc-label {
            font-size: 13px;
            font-weight: 600;
        }
        .mkt-svc-tile .mkt-sub {
            font-size: 12px;
        }
        .mkt-sale {
            align-items: flex-start;
        }
        .mkt-sale[data-tone="err"] {
            border-color: var(--mkt-err-line);
            background: var(--mkt-err-faint);
        }
        .mkt-sale > .mkt-order-main {
            gap: 8px;
        }
        .mkt-sale > .mkt-order-main > .mkt-sub {
            font-size: 12px;
        }
        .mkt-order-cover[data-size="xl"] {
            width: 96px;
            height: 96px;
            border-radius: 10px;
        }
        .mkt-sale-money {
            margin-left: auto;
            color: var(--bb-ui-warn-text);
            font-weight: 700;
            white-space: nowrap;
        }
        .mkt-sale-who {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            color: var(--bb-ui-muted);
            font-size: 13px;
        }
        .mkt-sale-who strong {
            color: var(--bb-ui-text);
            font-weight: 600;
        }
        .mkt-work-steps[data-n="3"] {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .mkt-work-steps[data-n="4"] {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .mkt-action-box[data-tone="done"] {
            flex-direction: row;
            align-items: flex-start;
            gap: 14px;
            border-color: var(--mkt-ok-line);
            background: var(--mkt-ok-faint);
        }
        .mkt-action-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .mkt-action-body > .mkt-sub {
            margin: 0;
            color: var(--mkt-text-soft);
            font-size: 13px;
            line-height: 1.5;
        }
        .mkt-action-box .bb-ui-button[data-key="quit"] {
            margin-left: auto;
        }
        .mkt-block[data-card] {
            gap: 14px;
            padding: 16px;
            border: 1px solid var(--bb-ui-line);
            border-radius: 12px;
            background: var(--mkt-faint);
        }
        .mkt-block[data-card] .mkt-text-part > strong {
            color: var(--bb-ui-muted);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        .mkt-facts[data-cols="3"] {
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }
        .mkt-facts[data-cols="3"] .mkt-fact {
            min-width: 0;
            border-color: transparent;
        }
        .mkt-facts[data-cols="3"] .mkt-fact dd {
            font-size: 14px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }
        .mkt-facts[data-cols="3"] .mkt-fact[data-span="2"] {
            grid-column: span 2;
        }
        .mkt-facts[data-cols="3"] .mkt-fact[data-span="all"] {
            grid-column: 1 / -1;
        }
        .mkt-fact dd small {
            color: var(--mkt-text-soft);
            font-size: 12px;
            font-weight: 400;
        }
        .mkt-take {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }
        .mkt-take[data-tone="accent"] {
            padding: 12px 14px;
            border-radius: 10px;
            background: var(--mkt-accent-step);
        }
        .mkt-take-label {
            font-size: 15px;
            font-weight: 600;
        }
        .mkt-take-value {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }
        .mkt-take-value strong {
            color: var(--bb-ui-warn-text);
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }
        .mkt-take-value .mkt-sub {
            font-size: 12px;
        }
        .mkt-take-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--mkt-soft-line);
        }
        .mkt-place {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin: 0;
        }
        .mkt-quote {
            padding: 12px 14px;
            border-radius: 10px;
            background: var(--bb-ui-tint);
            color: var(--bb-ui-text);
        }
        .mkt-req-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0;
        }
        .mkt-req-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border: 1px solid var(--bb-ui-line);
            border-radius: 999px;
            background: var(--bb-ui-tint);
            color: var(--mkt-text-soft);
            font-size: 12px;
        }
        .mkt-req-tag dd {
            margin: 0;
            color: var(--bb-ui-text);
            font-weight: 600;
        }
        .mkt-block-head > .mkt-action-title {
            flex: 1;
            min-width: 0;
        }
        .mkt-pairs {
            display: grid;
            grid-template-columns: 120px minmax(0, 1fr);
            gap: 4px 12px;
            margin: 0;
            font-size: 13px;
        }
        .mkt-pair {
            display: contents;
        }
        .mkt-pair dt {
            color: var(--mkt-text-soft);
        }
        .mkt-pair dd {
            margin: 0;
            overflow-wrap: anywhere;
        }
        @media (max-width: 560px) {
            .mkt-order-cover[data-size="xl"] {
                width: 72px;
                height: 72px;
            }
            .mkt-facts[data-cols="3"] {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .mkt-action-box .bb-ui-button[data-key="quit"] {
                margin-left: 0;
            }
            .mkt-svc-head {
                flex-wrap: wrap;
            }
            .mkt-svc-tiles {
                grid-template-columns: minmax(0, 1fr);
            }
            .mkt-svc-card[data-tone="accent"] .mkt-svc-tile {
                min-height: 0;
            }
        }
    </style>
</head>
<body>
    <section class="mkt" id="mkt" aria-label="Marketplace"></section>
    <script src="bb-ui.js"></script>
    <script src="marketplace-kit.js"></script>
    <script src="marketplace-notices.js"></script>
    <script src="marketplace-ui.js"></script>
</body>
</html>
